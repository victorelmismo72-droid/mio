<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MARINAFISK — Listados</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <h1>Listados de gestión</h1>
  <p class="ayuda">Todos filtran por fecha y se pueden exportar a CSV (para abrir en Excel).</p>

  <div class="tarjeta">
    <div class="fila-form">
      <div>
        <label for="l-tipo">Listado</label>
        <select id="l-tipo">
          <option value="ventas-por-cliente">Ventas por cliente</option>
          <option value="compras-por-proveedor">Compras por proveedor</option>
          <option value="rentabilidad-partidas">Rentabilidad por partida</option>
          <option value="margenes-por-articulo">Márgenes por artículo</option>
          <option value="movimiento-producto">Movimiento de producto (pedidos + traspasos)</option>
          <option value="stock-actual">Stock actual</option>
          <option value="clientes-sin-actividad">Clientes sin actividad reciente</option>
        </select>
      </div>
      <div id="campo-desde"><label for="l-desde">Desde</label><input type="date" id="l-desde"></div>
      <div id="campo-hasta"><label for="l-hasta">Hasta</label><input type="date" id="l-hasta"></div>
      <div id="campo-dias" style="display:none;"><label for="l-dias">Días sin actividad</label><input type="number" id="l-dias" value="90"></div>
      <div style="display:flex;align-items:flex-end;gap:0.5rem;">
        <button type="button" class="btn" id="btn-consultar">Consultar</button>
        <button type="button" class="btn secundario" id="btn-exportar">⬇️ Exportar CSV</button>
      </div>
    </div>
  </div>

  <div id="resultado"></div>
</main>

<script src="app.js"></script>
<script>
const usuario = protegerPagina();

function usaFecha(tipo) { return tipo !== 'clientes-sin-actividad' && tipo !== 'stock-actual'; }

document.getElementById('l-tipo').addEventListener('change', actualizarCamposFiltro);
function actualizarCamposFiltro() {
  const tipo = document.getElementById('l-tipo').value;
  document.getElementById('campo-desde').style.display = usaFecha(tipo) ? '' : 'none';
  document.getElementById('campo-hasta').style.display = usaFecha(tipo) ? '' : 'none';
  document.getElementById('campo-dias').style.display = tipo === 'clientes-sin-actividad' ? '' : 'none';
}

function construirQuery(formato) {
  const tipo = document.getElementById('l-tipo').value;
  const params = new URLSearchParams();
  if (usaFecha(tipo)) {
    if (document.getElementById('l-desde').value) params.set('desde', document.getElementById('l-desde').value);
    if (document.getElementById('l-hasta').value) params.set('hasta', document.getElementById('l-hasta').value);
  }
  if (tipo === 'clientes-sin-actividad') params.set('dias', document.getElementById('l-dias').value || 90);
  if (formato) params.set('formato', formato);
  return `/listados/${tipo}?${params.toString()}`;
}

document.getElementById('btn-consultar').addEventListener('click', async () => {
  const cont = document.getElementById('resultado');
  cont.innerHTML = '<p class="ayuda">Consultando...</p>';
  try {
    const res = await apiFetch(construirQuery());
    const filas = await res.json();
    pintarResultado(filas);
  } catch (e) { cont.innerHTML = `<p class="mensaje error">${e.message}</p>`; }
});

document.getElementById('btn-exportar').addEventListener('click', () => {
  // Se abre en pestana nueva con el token en la URL no es seguro; en vez de
  // eso, se pide el CSV ya autenticado y se ofrece como descarga con un blob.
  descargarCsv();
});

async function descargarCsv() {
  const res = await apiFetch(construirQuery('csv'));
  const texto = await res.text();
  const blob = new Blob([texto], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${document.getElementById('l-tipo').value}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function pintarResultado(filas) {
  const cont = document.getElementById('resultado');
  if (!filas.length) { cont.innerHTML = '<p class="ayuda">Sin resultados para ese filtro.</p>'; return; }
  const columnas = Object.keys(filas[0]);
  // Solo se formatean como cantidad (con separador de miles, alineado a la
  // derecha) las columnas que de verdad son una medida - todo lo demas que
  // "parece numero" (codigo de proveedor, telefono, numero de documento,
  // CIF...) es en realidad un identificador y se muestra tal cual, sin
  // tocar. Es mas seguro tener una lista de qué SÍ es cantidad que intentar
  // adivinar qué NO lo es.
  const PALABRAS_CANTIDAD = ['kilos', 'kg', 'total', 'importe', 'coste', 'base', 'iva', 'margen', 'num_', 'cajas', 'peso', 'rentabilidad', 'vendido', 'facturado', 'disponibles', 'comprados'];
  const esCantidad = (c) => PALABRAS_CANTIDAD.some((p) => c.includes(p));
  const esNumerico = (c, v) => esCantidad(c) && v !== null && v !== '' && !isNaN(Number(v)) && typeof v !== 'boolean';
  cont.innerHTML = `<div class="tabla-envoltorio"><table>
    <thead><tr>${columnas.map((c) => `<th>${c.replace(/_/g, ' ')}</th>`).join('')}</tr></thead>
    <tbody>${filas.map((f) => `<tr>${columnas.map((c) => {
      const v = f[c];
      if (c === 'fecha' || c.endsWith('_en')) return `<td>${fmtFecha(v)}</td>`;
      if (typeof v === 'boolean') return `<td>${v ? '✅ Sí' : '— No'}</td>`;
      if (esNumerico(c, v)) return `<td class="num">${Number(v).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>`;
      return `<td>${v ?? ''}</td>`;
    }).join('')}</tr>`).join('')}</tbody>
  </table></div>`;
}

if (usuario) {
  renderBarraNavegacion(usuario, 'listados.html');
  actualizarCamposFiltro();
  document.getElementById('l-desde').value = '2026-01-01';
  document.getElementById('l-hasta').value = fechaLocalISO();
}
</script>
</body>
</html>
