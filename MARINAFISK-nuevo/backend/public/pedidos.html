<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>MARINAFISK — Pedidos</title>
<link rel="stylesheet" href="app.css">
<style>
  #tabla-lineas-ped input, #tabla-lineas-ped select { min-width: 5.5rem; }
  .fila-totales td { font-weight: 700; background: #f4f6f5; }
  .celda-partida { white-space: normal; }
  .celda-partida select { min-width: 11rem; margin-bottom: 0.2rem; }
  .vista-toggle { display: flex; gap: 0.5rem; margin: 1rem 0; }
  .vista-toggle button.activo { background: #2f7d64; color: #fff; }
  #vista-cliente th, #vista-cliente td { }
</style>
</head>
<body>
<main>
  <h1>Pedidos / Albaranes</h1>
  <div id="mensaje"></div>

  <div class="tarjeta">
    <div class="fila-form">
      <div>
        <label for="p-cliente">Cliente</label>
        <input type="text" id="p-cliente" list="lista-clientes" placeholder="Código o nombre...">
        <datalist id="lista-clientes"></datalist>
      </div>
      <div>
        <label for="p-fecha">Fecha</label>
        <input type="date" id="p-fecha">
      </div>
    </div>
    <p id="p-cliente-info" class="ayuda"></p>

    <h2>Líneas</h2>
    <datalist id="lista-articulos"></datalist>
    <div class="tabla-envoltorio">
      <table id="tabla-lineas-ped">
        <thead><tr><th>Artículo</th><th>Descripción</th><th class="num">Cajas</th><th class="num">Peso (kg)</th><th class="num">Precio/kg</th><th class="num">Dcto %</th><th class="num">Total</th><th>Partida</th><th></th></tr></thead>
        <tbody></tbody>
        <tfoot><tr class="fila-totales"><td colspan="2"></td><td class="num" id="tot-cajas">0</td><td class="num" id="tot-peso">0</td><td colspan="2"></td><td class="num" id="tot-total">0,00 €</td><td colspan="2"></td></tr></tfoot>
      </table>
    </div>
    <button type="button" class="btn secundario" id="btn-anadir-linea" style="margin-top:0.7rem;">+ Añadir línea</button>

    <div style="margin-top:1.4rem;">
      <button type="button" class="btn" id="btn-guardar">Guardar pedido</button>
      <button type="button" class="btn secundario" id="btn-cancelar-edicion" style="display:none;">Cancelar edición</button>
    </div>
  </div>

  <div class="vista-toggle">
    <button type="button" class="btn secundario activo" data-vista="interna">Vista interna (con precios y partida)</button>
    <button type="button" class="btn secundario" data-vista="cliente">Vista cliente (sin precios ni partida)</button>
  </div>
  <div class="tabla-envoltorio" id="vista-previa"></div>

  <h2>Historial de pedidos</h2>
  <p class="ayuda">Busca por cualquier campo — igual que en el programa actual, no hace falta que el pedido esté entre los últimos.</p>
  <div class="tarjeta">
    <div class="fila-form">
      <div><label for="h-num">Nº</label><input type="text" id="h-num" placeholder="Nº de pedido..."></div>
      <div><label for="h-cli">Cliente</label><input type="text" id="h-cli" placeholder="Código o nombre..."></div>
      <div><label for="h-desde">Desde</label><input type="date" id="h-desde"></div>
      <div><label for="h-hasta">Hasta</label><input type="date" id="h-hasta"></div>
      <div style="display:flex;align-items:flex-end;"><button type="button" class="btn secundario" id="btn-limpiar-filtro">Limpiar</button></div>
    </div>
  </div>
  <div class="tabla-envoltorio">
    <table id="tabla-historico">
      <thead><tr><th>Nº</th><th>Fecha</th><th>Cliente</th><th class="num">Total</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script src="app.js"></script>
<script>
const usuario = protegerPagina();
let clientes = [];
let articulos = [];
let lineas = [];
// Igual que el HTML actual (funcion cargarPedido/grabarPedido): "editar" no
// es un PATCH parcial, es recargar el pedido entero en el formulario y, al
// grabar, sustituir cabecera + lineas manteniendo el mismo numero (nunca se
// pide uno nuevo de la secuencia). null = modo "pedido nuevo".
let pedidoEnEdicionId = null;
let pedidoEnEdicionNumero = null;

function lineaVacia() {
  return { articulo_codigo: '', descripcion: '', cantidad: '', peso: '', precio: '', descuento: 0, partida_numero: null, partida_manual: false, _candidatos: [], _estado: null };
}

async function cargarClientes() {
  const res = await apiFetch('/clientes');
  clientes = await res.json();
  document.getElementById('lista-clientes').innerHTML = clientes.map((c) => `<option value="${c.codigo} — ${c.nombre}">`).join('');
}

function clienteSeleccionado() {
  const codigo = document.getElementById('p-cliente').value.trim().split(' — ')[0].trim();
  return clientes.find((c) => c.codigo === codigo) || null;
}

// Autocompletar Artículo (Fase 4: buscar por codigo o descripcion escribiendo
// una letra o palabra) - mismo mecanismo que Proveedor/Cliente/Producto.
async function cargarArticulos() {
  const res = await apiFetch('/articulos');
  articulos = await res.json();
  document.getElementById('lista-articulos').innerHTML = articulos.map((a) => `<option value="${a.codigo} — ${a.descripcion || ''}">`).join('');
}

// El campo puede llevar "codigo — descripcion" pegado por el datalist -
// aqui se separa el codigo real, igual que ya se hace con Cliente/Proveedor.
function codigoDeTexto(texto) {
  return String(texto || '').split(' — ')[0].trim();
}

function autorrellenarDescripcionArticulo(l, tr) {
  const codigo = codigoDeTexto(l.articulo_codigo);
  const art = articulos.find((a) => a.codigo === codigo);
  if (art && !l.descripcion) {
    l.descripcion = art.descripcion || '';
    const inputDesc = tr.querySelector('[data-campo="descripcion"]');
    if (inputDesc) inputDesc.value = l.descripcion;
  }
}

document.getElementById('p-cliente').addEventListener('input', () => {
  const c = clienteSeleccionado();
  document.getElementById('p-cliente-info').textContent = c ? `${c.nombre} — ${c.tipo_iva === 'INTRACOMUNITARIO' ? 'Intracomunitario' : 'Nacional'}${c.recargo_equivalencia ? ' con Recargo de Equivalencia' : ''}` : '';
});

function calcularTotal(l) {
  const peso = Number(l.peso) || 0;
  const precio = Number(l.precio) || 0;
  const dcto = Number(l.descuento) || 0;
  return peso * precio * (1 - dcto / 100);
}

async function evaluarPartida(l) {
  const codigo = codigoDeTexto(l.articulo_codigo);
  if (!codigo || !(Number(l.peso) > 0) || !(Number(l.precio) > 0)) {
    l._estado = null; l._candidatos = []; l.partida_numero = null;
    return;
  }
  const res = await apiFetch('/partidas/asignar', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ articulo_codigo: codigo, precio_venta: l.precio }),
  });
  const datos = await res.json();
  l._candidatos = datos.candidatos;
  l._margenMinimo = datos.margen_minimo;
  if (!l.partida_manual) {
    l._estado = datos.estado;
    l.partida_numero = datos.estado === 'OK' ? datos.partida_numero : null;
  } else {
    l._estado = 'MANUAL';
  }
}

function celdaPartidaHtml(l, i) {
  if (!l._candidatos || !l._candidatos.length) {
    return l.articulo_codigo ? '<span class="ayuda">Sin compras</span>' : '<span class="ayuda">—</span>';
  }
  const opciones = l._candidatos.map((c) => {
    const margen = (Number(l.precio) || 0) - c.coste;
    const marca = margen >= (l._margenMinimo || 1.3) ? '✅' : '⚠️';
    const sel = String(c.numero_partida) === String(l.partida_numero) ? ' selected' : '';
    return `<option value="${c.numero_partida}"${sel}>${c.numero_partida} · ${fmtFecha(c.fecha)} · ${fmtEUR(c.coste)} ${marca}</option>`;
  }).join('');
  const pill = l._estado === 'OK'
    ? '<span class="pill ok">✅ auto</span>'
    : '<span class="pill warn">⚠️ elige tú</span>';
  return `<select data-partida="${i}"><option value="">-- elegir --</option>${opciones}</select> ${pill}`;
}

// Importante para la agilidad (Fase 4 punto 2): los <input> de texto/numero
// nunca se reconstruyen mientras el usuario escribe o tabula entre campos -
// eso le haria perder el foco a mitad de teclear. Solo se actualizan en el
// sitio la celda de total y la celda de partida (que si cambia de contenido,
// por ejemplo al pasar de "Sin compras" a un desplegable).
function bindSelectPartida(celdaPartida, l, i, tr) {
  const sel = celdaPartida.querySelector('[data-partida]');
  if (!sel) return;
  sel.addEventListener('change', () => {
    l.partida_numero = sel.value || null;
    l.partida_manual = true;
    celdaPartida.innerHTML = celdaPartidaHtml(l, i);
    bindSelectPartida(celdaPartida, l, i, tr);
    actualizarTotalesPed();
    pintarVistaPrevia();
  });
}

async function actualizarFilaPedido(tr, l, i) {
  await evaluarPartida(l);
  tr.querySelector('[data-calc=total]').innerHTML = `<strong>${fmtEUR(calcularTotal(l))}</strong>`;
  const celdaPartida = tr.querySelector('.celda-partida');
  celdaPartida.innerHTML = celdaPartidaHtml(l, i);
  bindSelectPartida(celdaPartida, l, i, tr);
  actualizarTotalesPed();
}

function actualizarTotalesPed() {
  let totCajas = 0, totPeso = 0, totTotal = 0;
  lineas.forEach((l) => { totCajas += Number(l.cantidad) || 0; totPeso += Number(l.peso) || 0; totTotal += calcularTotal(l); });
  document.getElementById('tot-cajas').textContent = totCajas;
  document.getElementById('tot-peso').textContent = fmtKg(totPeso);
  document.getElementById('tot-total').textContent = fmtEUR(totTotal);
}

function pintarLineas() {
  const tbody = document.querySelector('#tabla-lineas-ped tbody');
  tbody.innerHTML = '';

  lineas.forEach((l, i) => {
    const total = calcularTotal(l);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" data-campo="articulo_codigo" list="lista-articulos" value="${l.articulo_codigo}" style="width:6rem;"></td>
      <td><input type="text" data-campo="descripcion" value="${l.descripcion}" style="width:11rem;"></td>
      <td class="num"><input type="number" data-campo="cantidad" value="${l.cantidad}" style="width:4rem;text-align:right;" min="0"></td>
      <td class="num"><input type="number" step="0.01" data-campo="peso" value="${l.peso}" style="width:5.5rem;text-align:right;"></td>
      <td class="num"><input type="number" step="0.01" data-campo="precio" value="${l.precio}" style="width:5.5rem;text-align:right;"></td>
      <td class="num"><input type="number" step="0.1" data-campo="descuento" value="${l.descuento}" style="width:4rem;text-align:right;"></td>
      <td class="num" data-calc="total"><strong>${fmtEUR(total)}</strong></td>
      <td class="celda-partida">${celdaPartidaHtml(l, i)}</td>
      <td><button type="button" class="btn secundario" data-quitar="${i}" style="padding:0.2rem 0.5rem;">✕</button></td>
    `;
    // Los campos de texto (articulo/descripcion) se guardan segundo a
    // segundo con 'input' sin recalcular nada pesado; peso/precio/descuento
    // recalculan al confirmar el valor ('change', es decir, al salir del
    // campo), que es cuando de verdad hace falta consultar partidas.
    tr.querySelectorAll('input').forEach((input) => {
      input.addEventListener('input', () => {
        l[input.dataset.campo] = input.value;
        if (input.dataset.campo === 'articulo_codigo') autorrellenarDescripcionArticulo(l, tr);
      });
      input.addEventListener('change', async () => {
        l[input.dataset.campo] = input.value;
        if (['articulo_codigo', 'peso', 'precio', 'descuento'].includes(input.dataset.campo)) {
          await actualizarFilaPedido(tr, l, i);
          pintarVistaPrevia();
        } else if (input.dataset.campo === 'cantidad') {
          actualizarTotalesPed();
        }
      });
    });
    bindSelectPartida(tr.querySelector('.celda-partida'), l, i, tr);
    tr.querySelector('[data-quitar]').addEventListener('click', () => { lineas.splice(i, 1); pintarLineas(); pintarVistaPrevia(); });
    tbody.appendChild(tr);
  });

  actualizarTotalesPed();
}

document.getElementById('btn-anadir-linea').addEventListener('click', () => { lineas.push(lineaVacia()); pintarLineas(); pintarVistaPrevia(); });

let vistaActual = 'interna';
document.querySelectorAll('.vista-toggle button').forEach((btn) => {
  btn.addEventListener('click', () => {
    vistaActual = btn.dataset.vista;
    document.querySelectorAll('.vista-toggle button').forEach((b) => b.classList.toggle('activo', b === btn));
    pintarVistaPrevia();
  });
});

function pintarVistaPrevia() {
  const cont = document.getElementById('vista-previa');
  const validas = lineas.filter((l) => l.articulo_codigo && Number(l.peso) > 0);
  if (!validas.length) { cont.innerHTML = '<p class="ayuda">Añade líneas para ver la vista previa del albarán.</p>'; return; }

  if (vistaActual === 'cliente') {
    // Vista cliente: NUNCA precio de coste ni numero de partida (Fase 0 punto 3).
    cont.innerHTML = `<table><thead><tr><th>Artículo</th><th class="num">Cajas</th><th class="num">Peso (kg)</th></tr></thead><tbody>
      ${validas.map((l) => `<tr><td>${l.descripcion || l.articulo_codigo}</td><td class="num">${l.cantidad || ''}</td><td class="num">${fmtKg(l.peso)}</td></tr>`).join('')}
    </tbody></table>`;
  } else {
    cont.innerHTML = `<table><thead><tr><th>Artículo</th><th class="num">Cajas</th><th class="num">Peso (kg)</th><th class="num">Precio</th><th class="num">Total</th><th>Partida</th></tr></thead><tbody>
      ${validas.map((l) => `<tr><td>${l.descripcion || l.articulo_codigo}</td><td class="num">${l.cantidad || ''}</td><td class="num">${fmtKg(l.peso)}</td><td class="num">${fmtEUR(l.precio)}</td><td class="num">${fmtEUR(calcularTotal(l))}</td><td>${l.partida_numero || '(sin asignar)'}</td></tr>`).join('')}
    </tbody></table>`;
  }
}

function mostrarMensaje(texto, tipo) {
  document.getElementById('mensaje').innerHTML = `<div class="mensaje ${tipo}">${texto}</div>`;
}

function activarModoEdicion(id, numero) {
  pedidoEnEdicionId = id;
  pedidoEnEdicionNumero = numero;
  document.getElementById('btn-guardar').textContent = `Guardar cambios (editando pedido Nº ${numero})`;
  document.getElementById('btn-cancelar-edicion').style.display = '';
}

function cancelarEdicionPedido() {
  pedidoEnEdicionId = null;
  pedidoEnEdicionNumero = null;
  document.getElementById('btn-guardar').textContent = 'Guardar pedido';
  document.getElementById('btn-cancelar-edicion').style.display = 'none';
  document.getElementById('p-cliente').value = '';
  document.getElementById('p-cliente-info').textContent = '';
  document.getElementById('p-fecha').value = fechaLocalISO();
  lineas = [lineaVacia()];
  pintarLineas();
  pintarVistaPrevia();
}
document.getElementById('btn-cancelar-edicion').addEventListener('click', cancelarEdicionPedido);

// Carga un pedido ya grabado en el formulario para modificarlo - misma idea
// que "cargarPedido(num)" del HTML actual: rellena cliente/fecha/lineas y
// deja el pedido listo para volver a GRABAR.
async function cargarPedidoParaEditar(id) {
  const res = await apiFetch(`/pedidos/${id}`);
  if (!res.ok) { mostrarMensaje('No se pudo cargar el pedido.', 'error'); return; }
  const ped = await res.json();

  const c = clientes.find((x) => x.codigo === ped.cliente_codigo);
  document.getElementById('p-cliente').value = `${ped.cliente_codigo}${c ? ' — ' + c.nombre : ''}`;
  document.getElementById('p-cliente-info').textContent = c
    ? `${c.nombre} — ${c.tipo_iva === 'INTRACOMUNITARIO' ? 'Intracomunitario' : 'Nacional'}${c.recargo_equivalencia ? ' con Recargo de Equivalencia' : ''}`
    : '';
  document.getElementById('p-fecha').value = ped.fecha ? ped.fecha.slice(0, 10) : fechaLocalISO();

  lineas = (ped.lineas || []).map((l) => ({
    articulo_codigo: l.articulo_codigo || '',
    descripcion: l.descripcion || '',
    cantidad: l.cantidad ?? '',
    peso: l.peso ?? '',
    precio: l.precio ?? '',
    descuento: l.descuento ?? 0,
    partida_numero: l.partida_numero,
    partida_manual: l.partida_manual,
    _candidatos: [], _estado: null,
  }));
  if (!lineas.length) lineas = [lineaVacia()];
  // Se reconsulta partidas disponibles para cada linea (respetando
  // partida_manual, igual que al escribir a mano) antes de pintar, para no
  // enseñar el desplegable vacio un instante.
  for (const l of lineas) { await evaluarPartida(l); } // eslint-disable-line no-await-in-loop

  pintarLineas();
  pintarVistaPrevia();
  activarModoEdicion(ped.id, ped.numero);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  mostrarMensaje(`Pedido ${ped.numero} cargado para editar. Modifica y pulsa "Guardar cambios".`, 'info');
}

// Fallo real conocido del HTML actual (informe de Víctor, 29/08/2026): un
// doble clic/doble tap en "Guardar" (o un rebote táctil) puede disparar dos
// guardados casi simultáneos antes de que termine el primero. Aquí se
// bloquea el botón nada más pulsar - ANTES de nada más - y no se libera
// hasta que el guardado (con éxito o error) haya terminado del todo.
// Cualquier clic mientras `guardandoPedido` es true se ignora sin más.
let guardandoPedido = false;
document.getElementById('btn-guardar').addEventListener('click', async () => {
  if (guardandoPedido) return;
  guardandoPedido = true;
  document.getElementById('btn-guardar').disabled = true;
  try {
    await intentarGuardarPedido();
  } finally {
    guardandoPedido = false;
    document.getElementById('btn-guardar').disabled = false;
  }
});

async function intentarGuardarPedido() {
  const c = clienteSeleccionado();
  if (!c) { mostrarMensaje('Elige un cliente válido de la lista.', 'error'); return; }
  // El Artículo puede llevar "codigo — descripcion" pegado por el datalist -
  // se guarda solo el codigo (igual que Producto en Compras).
  const validas = lineas
    .filter((l) => l.articulo_codigo && Number(l.peso) > 0)
    .map((l) => ({ ...l, articulo_codigo: codigoDeTexto(l.articulo_codigo) }));
  if (!validas.length) { mostrarMensaje('Añade al menos una línea con artículo y peso.', 'error'); return; }

  const esEdicion = pedidoEnEdicionId != null;
  const cuerpo = {
    cliente_codigo: c.codigo,
    cliente_nombre_snapshot: c.nombre,
    cliente_cif_snapshot: c.cif,
    cliente_dir_snapshot: c.direccion,
    cliente_pob_snapshot: c.poblacion,
    cliente_tel_snapshot: c.telefono,
    fecha: document.getElementById('p-fecha').value || fechaLocalISO(),
    base: validas.reduce((s, l) => s + calcularTotal(l), 0),
    lineas: validas.map((l) => ({ ...l, total: calcularTotal(l) })),
  };
  // Al editar se mantiene el mismo numero de pedido (igual que el HTML
  // actual) - si no se manda, el backend lo tomaria como vacio y rompería
  // la cabecera.
  if (esEdicion) cuerpo.numero = pedidoEnEdicionNumero;

  try {
    const res = await apiFetch(esEdicion ? `/pedidos/${pedidoEnEdicionId}` : '/pedidos', {
      method: esEdicion ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    });
    const datos = await res.json();
    if (!res.ok) { mostrarMensaje(datos.error || 'No se pudo guardar.', 'error'); return; }
    mostrarMensaje(`Pedido ${esEdicion ? 'actualizado' : 'guardado'} — nº ${datos.numero}, total ${fmtEUR(datos.base)}.`, 'ok');
    cancelarEdicionPedido();
    cargarHistorico();
  } catch (e) { mostrarMensaje(e.message, 'error'); }
}

// Historial completo, igual que "filtrarHis()" del HTML actual: buscar por
// numero, cliente, rango de fechas - no solo ver los ultimos. Se trae la
// lista entera una vez (1057 pedidos no da problema de agilidad) y se
// filtra en el propio navegador, para que cada tecla de busqueda no tenga
// que ir al servidor.
let todosPedidos = [];

async function cargarHistorico() {
  const res = await apiFetch('/pedidos');
  todosPedidos = await res.json();
  pintarHistorico();
}

function pintarHistorico() {
  const num = document.getElementById('h-num').value.trim();
  const cli = document.getElementById('h-cli').value.trim().toLowerCase();
  const desde = document.getElementById('h-desde').value;
  const hasta = document.getElementById('h-hasta').value;
  const hayFiltro = num || cli || desde || hasta;

  let filas = todosPedidos;
  if (num) filas = filas.filter((p) => String(p.numero).includes(num));
  if (cli) filas = filas.filter((p) => (p.cliente_codigo || '').toLowerCase().includes(cli) || (p.cliente_nombre_snapshot || '').toLowerCase().includes(cli));
  if (desde) filas = filas.filter((p) => p.fecha >= desde);
  if (hasta) filas = filas.filter((p) => p.fecha <= hasta);
  filas = filas.slice().sort((a, b) => b.numero - a.numero);
  // Sin ningun filtro, para no pintar los 1000+ pedidos de golpe se enseñan
  // solo los ultimos 30 - en cuanto se busca algo, se enseñan todas las
  // coincidencias (puede ser un pedido muy antiguo).
  if (!hayFiltro) filas = filas.slice(0, 30);

  const tbody = document.querySelector('#tabla-historico tbody');
  if (!filas.length) { tbody.innerHTML = '<tr><td colspan="5" class="ayuda">Sin pedidos para ese filtro.</td></tr>'; return; }
  tbody.innerHTML = filas.map((p) => `
    <tr><td>${p.numero}</td><td>${fmtFecha(p.fecha)}</td><td>${p.cliente_nombre_snapshot || p.cliente_codigo}</td><td class="num">${fmtEUR(p.base)}</td>
    <td>
      <button type="button" class="btn secundario" data-editar-pedido="${p.id}" style="padding:0.2rem 0.6rem;">✏️ Editar</button>
      <button type="button" class="btn secundario" data-anular-pedido="${p.id}" data-numero-pedido="${p.numero}" style="padding:0.2rem 0.6rem;">🗑️ Anular</button>
    </td></tr>
  `).join('');
  document.querySelectorAll('[data-editar-pedido]').forEach((btn) => {
    btn.addEventListener('click', () => cargarPedidoParaEditar(btn.dataset.editarPedido));
  });
  document.querySelectorAll('[data-anular-pedido]').forEach((btn) => {
    btn.addEventListener('click', () => anularPedido(btn.dataset.anularPedido, btn.dataset.numeroPedido));
  });
}
['h-num', 'h-cli', 'h-desde', 'h-hasta'].forEach((id) => {
  document.getElementById(id).addEventListener('input', pintarHistorico);
});
document.getElementById('btn-limpiar-filtro').addEventListener('click', () => {
  ['h-num', 'h-cli', 'h-desde', 'h-hasta'].forEach((id) => { document.getElementById(id).value = ''; });
  pintarHistorico();
});

// Anular un pedido - igual que "anularPedido()" del HTML actual: pide
// confirmacion explicita (no se puede deshacer) y lo borra del todo. Si es
// el pedido que se estaba editando en el formulario, se vuelve a modo
// "pedido nuevo" para no dejar el formulario apuntando a algo ya borrado.
async function anularPedido(id, numero) {
  if (!confirm(`¿Anular el pedido nº ${numero}? Esta acción no se puede deshacer.`)) return;
  try {
    const res = await apiFetch(`/pedidos/${id}`, { method: 'DELETE' });
    if (!res.ok) { const datos = await res.json().catch(() => ({})); mostrarMensaje(datos.error || 'No se pudo anular.', 'error'); return; }
    mostrarMensaje(`Pedido nº ${numero} anulado.`, 'ok');
    if (String(pedidoEnEdicionId) === String(id)) cancelarEdicionPedido();
    cargarHistorico();
  } catch (e) { mostrarMensaje(e.message, 'error'); }
}

if (usuario) {
  renderBarraNavegacion(usuario, 'pedidos.html');
  document.getElementById('p-fecha').value = fechaLocalISO();
  lineas = [lineaVacia()];
  pintarLineas();
  pintarVistaPrevia();
  cargarClientes();
  cargarArticulos();
  cargarHistorico();
}
